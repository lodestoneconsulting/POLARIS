            function fmtPrecipIn(d) {
              if (isNum(d.precip_in_total)) return fmtFixed(d.precip_in_total, 2, " in");
              if (isNum(d.precip_in)) return fmtFixed(d.precip_in, 2, " in");
              if (isNum(d.precip_mm_total)) return fmtFixed(d.precip_mm_total / 25.4, 2, " in");
              if (isNum(d.precip_mm)) return fmtFixed(d.precip_mm / 25.4, 2, " in");
              return "—";
            }

            function fmtSunLine(d) {
              // Prefer sun_hours if present
              if (isNum(d.sun_hours)) return `Expected Sun: <b>${d.sun_hours.toFixed(1)} hrs</b>`;
              // Fallback to your old bucket
              if (d.solar) return `Sun: <b>${String(d.solar)}</b>`;
              return `Expected Sun: <b>—</b>`;
            }

            function headerLineTempWind(c) {
              const t = isNum(c.temp_f) ? `${c.temp_f.toFixed(0)}°F` : "—";
              const w = isNum(c.wind_kn) ? `${c.wind_kn.toFixed(0)} kn` : "—";
              const dir = c.wind_dir ? ` ${c.wind_dir}` : "";
              return `Temp: ${t} • Wind: ${w}${dir}`;
            }

            function headerLineNow(c) {
              const now = c.summary ? String(c.summary) : "—";
              return `Now: ${now}`;
            }

            function build() {
              document.getElementById("wxTitle").textContent = "Puget Island, WA - Weather";

              const c = WX.current || {};

              const line1 = headerLineTempWind(c);
              const line2 = headerLineNow(c);

              document.getElementById("wxSub").innerHTML =
                `<div class="wx-subline">${line1}</div>` +
                `<div class="wx-subline">${line2}</div>`;

              const curLines = [];
              curLines.push(`<div class="wx-row"><div class="wx-k">Temp</div><div><b>${fmtFixed(c.temp_f, 0, "°F")}</b></div></div>`);
              curLines.push(`<div class="wx-row"><div class="wx-k">Wind</div><div><b>${fmtFixed(c.wind_kn, 0, " kn")}</b> ${fmt(c.wind_dir, "")}</div></div>`);
              curLines.push(`<div class="wx-row"><div class="wx-k">Now</div><div>${fmt(c.summary, "")}</div></div>`);
              document.getElementById("wxCurrent").innerHTML = curLines.join("");

              const days = WX.days || [];
              const fc = [];
              if (!days.length) {
                fc.push(`<div class="wx-row"><div>5-day forecast unavailable</div></div>`);
              } else {
                for (const d of days) {
                  const dateLabel = d.date || "";
                  const left = `<div class="wx-day-date">${dateLabel}</div>`;

                  const precipChance = (d.precip_chance_max === null || d.precip_chance_max === undefined)
                    ? "—"
                    : String(d.precip_chance_max) + "%";

                  const precipAmt = fmtPrecipIn(d);
                  const sunLine = fmtSunLine(d);

                  const right = `
                    <div class="wx-small">
                      High/Low: <b>${fmtFixed(d.high_f, 0, "°F")}</b> / <b>${fmtFixed(d.low_f, 0, "°F")}</b><br>
                      Wind: <b>${fmtFixed(d.wind_kn_avg, 0, " kn")}</b><br>
                      Precip: <b>${precipChance}</b> • <b>${precipAmt}</b><br>
                      ${sunLine}
                    </div>`;
                  fc.push(`<div class="wx-day">${left}${right}</div>`);
                }
              }
              document.getElementById("wxForecast").innerHTML = fc.join("");

              const gen = WX.generated_iso ? ` • Generated: ${WX.generated_iso}` : "";
              document.getElementById("wxFoot").textContent = `Source: NWS API (api.weather.gov)${gen}`;
            }

            window.__wx_toggle = function() {
              window.__wx_open = !window.__wx_open;
              document.getElementById("wxBody").style.display = window.__wx_open ? "block" : "none";
              document.getElementById("wxChevron").textContent = window.__wx_open ? "▴" : "▾";
              
              // Notify site data gaps widget to reposition when weather expands/collapses
              if (window.__dg_reposition) {
                window.__dg_reposition();
              }
            };

            build();
          })();

            function esc(s) {
              return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            }

            function build() {
              const sitesEl = document.getElementById("dgSites");
              const warnEl = document.getElementById("dgWarn");
              const footEl = document.getElementById("dgFoot");

              if (DG.warning) {
                warnEl.style.display = "block";
                warnEl.textContent = DG.warning;
              }

              const sites = DG.sites || [];
              if (!sites.length) {
                sitesEl.innerHTML = `<div style="font-size:10px; opacity:0.85;">No sites found for this window.</div>`;
              } else {
                const rows = [];
                for (const s of sites) {
                  const mc = esc(s.mc_id);
                  const bins = s.bins || [];
                  const pct = (s.uptime_pct !== undefined && s.uptime_pct !== null) ? String(s.uptime_pct) : "—";

                  const binSpans = [];
                  for (let i=0; i<bins.length; i++) {
                    const v = bins[i];
                    const cls = v === 1 ? "up" : v === 2 ? "nc" : "";
                    binSpans.push(`<span class="dg-bin ${cls}"></span>`);
                  }

                  rows.push(`
                    <div class="dg-row">
                      <div class="dg-label">${mc}</div>
                      <div class="dg-strip-wrap"><div class="dg-strip">${binSpans.join("")}</div></div>
                      <div class="dg-pct">${pct}%</div>
                    </div>
                  `);
                }
                sitesEl.innerHTML = rows.join("");
              }

              const left = DG.generated_iso ? `Generated: ${DG.generated_iso}` : "";
              const right = `${DG.days_back || ""} days \u2013 ${DG.bin_minutes || ""} min. bins`;
              footEl.innerHTML =
                `<div style="display:flex; justify-content:space-between; gap:10px; margin-bottom:3px;">` +
                `<span style="font-size:10px; opacity:0.6;">\u2190 Past</span>` +
                `<span style="font-size:10px; opacity:0.6;">Now \u2192</span></div>` +
                `<div style="display:flex; justify-content:space-between; gap:10px;"><span>${left}</span><span>${right}</span></div>`;
            }

            window.__dg_toggle = function() {
              window.__dg_open = !window.__dg_open;
              document.getElementById("dgBody").style.display = window.__dg_open ? "block" : "none";
              document.getElementById("dgChevron").textContent = window.__dg_open ? "▴" : "▾";
            }

            // Calculate proper position based on weather widget
            function calculatePosition() {
              const weatherWidget = document.querySelector('.wx-widget');
              const dgWidget = document.getElementById('dgWidget');
              
              if (!weatherWidget || !dgWidget) {
                console.log('Site Data Gaps: Missing elements for positioning');
                return;
              }
              
              // Get the weather widget's actual bottom position
              // This accounts for its top position, height, and expanded state
              const weatherRect = weatherWidget.getBoundingClientRect();
              const weatherBottom = weatherRect.bottom;
              
              // Position site data gaps with minimal spacing below the weather widget
              const spacing = 3;  // Small gap between widgets (adjustable)
              const newTop = weatherBottom + spacing;
              
              dgWidget.style.top = newTop + 'px';
              
              console.log('Site Data Gaps positioned at:', newTop, 'px (weather bottom:', weatherBottom, ')');
            }

            // Register as reposition function for weather widget to call
            window.__dg_reposition = function() {
              // Use setTimeout to ensure DOM has updated after weather expansion
              setTimeout(calculatePosition, 10);
            }

            build();
            
            // Calculate initial position after page loads
            if (document.readyState === 'complete') {
              calculatePosition();
            } else {
              window.addEventListener('load', function() {
                // Give time for weather widget to fully render
                setTimeout(calculatePosition, 100);
              });
            }
            
            // Recalculate on window resize
            window.addEventListener('resize', calculatePosition);
          })();
        </script>
